openapi: 3.1.0
info:
  title: Freecast dd2vtt import subset
  version: 1.0.0
# Session-authenticated same-origin web API; CSRF required on all mutations.
# 30-minute preview; image stored privately, normalized geometry master-only.
paths:
  /mesas/{room}/importacoes/dd2vtt:
    post:
      operationId: prepareDd2vtt
      description: Owner/master only. Multipart file <=29MiB; throttle 10/min. Never creates a map.
      responses:
        '200': {description: 'preview id/title/image_url/expires_at/width/height/cell_size/counts/warnings'}
        '403': {description: Current room management permission required}
        '419': {description: Invalid or missing CSRF token}
        '422': {description: Invalid file or unsupported subset; errors.file}
        '429': {description: Too many previews}
  /mesas/{room}/importacoes/dd2vtt/{preview}/imagem:
    get:
      operationId: getDd2vttPreviewImage
      description: Author and current master only; private no-store PNG/WebP; no raw JSON.
      responses:
        '200': {description: Image bytes}
        '403': {description: No current management permission}
        '404': {description: Wrong room or author}
        '410': {description: Expired or already confirmed preview}
  /mesas/{room}/importacoes/dd2vtt/{preview}/confirmar:
    post:
      operationId: confirmDd2vtt
      description: 'Empty body. Preview id is idempotency key, bound immutable title/content. Room lock, current authorization, transaction and outbox. New import requires new preview.'
      responses:
        '200': {description: mapId/commandId/replayed/url; same result on replay}
        '403': {description: No current management permission}
        '404': {description: Wrong room or author}
        '410': {description: Expired or missing/altered staged image; imported map deleted}
        '419': {description: Invalid or missing CSRF token}
        '500': {description: Storage/database failure; compensates uncommitted operation files only}
  /mesas/{room}/importacoes/dd2vtt/{preview}:
    delete:
      operationId: cancelDd2vtt
      responses:
        '204': {description: Staging and preview discarded; no permanent map}
        '409': {description: Preview already confirmed}
        '410': {description: Preview expired}
        '419': {description: Invalid or missing CSRF token}
x-contract:
  format: [0.2, 0.3]
  transformation: '(point - map_origin) * pixels_per_grid; y down; ranges scale only'
  world_bounds: [200, 8000]
  max_pixels: 16000000
  cell_size: [8, 256]
  image_bytes: 20971520
  json_bytes: 30408704
  json_depth: 32
  walls: 1000
  portals: 1000
  lights: 1000
  polyline_points: [2, 256]
  total_points: 20000
  initial_fog: enabled_fully_covered
  active_map: unchanged
  geometry_audience: current_owner_or_master_only
  public_event: 'map.created with map_id/title only; no geometry or raw JSON'
