services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-freecast}
      POSTGRES_USER: ${DB_USERNAME:-freecast}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env antes de iniciar o PostgreSQL}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-freecast} -d ${DB_DATABASE:-freecast}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
